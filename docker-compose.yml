version: "3.9"
services:
  postgres:
    image: postgres:16
    container_name: badgeone-postgres
    environment:
      POSTGRES_DB: badgeone
      POSTGRES_USER: badgeone
      POSTGRES_PASSWORD: badgeone
    ports:
      - "5432:5432"
    volumes:
      - badgeone_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: badgeone-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: badgeone-backend
    environment:
      APP_ENV: production
      APP_NAME: Badge One API
      DATABASE_URL: postgresql+psycopg://badgeone:badgeone@postgres:5432/badgeone
      JWT_SECRET: CHANGE_ME_STRONG_SECRET
      JWT_ALGORITHM: HS256
    depends_on:
      - postgres
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: badgeone-frontend
    environment:
      NEXT_PUBLIC_API_BASE: /api
    depends_on:
      - backend
    expose:
      - "3001"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: badgeone-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/letsencrypt:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    container_name: badgeone-certbot
    volumes:
      - ./certbot/letsencrypt:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: sh -c "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done"
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  badgeone_pgdata:
