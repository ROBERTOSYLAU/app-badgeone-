version: "3.9"

services:
postgres:
image: postgres:16
container_name: badgeone-postgres
environment:
POSTGRES_DB: badgeone
POSTGRES_USER: badgeone
POSTGRES_PASSWORD: badgeone
expose:
- "5432"
volumes:
- badgeone_pgdata:/var/lib/postgresql/data
restart: unless-stopped

redis:
image: redis:7
container_name: badgeone-redis
expose:
- "6379"
restart: unless-stopped

backend:
build:
context: ./backend
container_name: badgeone-backend
environment:
APP_ENV: production
APP_NAME: "Badge One API"
DATABASE_URL: "postgresql+psycopg://badgeone:badgeone@postgres:5432/badgeone"
JWT_SECRET: "CHANGE_ME_STRONG_SECRET"
JWT_ALGORITHM: HS256
depends_on:
- postgres
- redis
expose:
- "8000"
restart: unless-stopped
frontend:
build:
context: ./frontend
container_name: badgeone-frontend
environment:
NEXT_PUBLIC_API_BASE: /api
depends_on:
- backend
expose:
- "3001"
restart: unless-stopped

nginx:
image: nginx:1.27-alpine
container_name: badgeone-nginx
