version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: badgeone_postgres
    restart: always
    environment:
      POSTGRES_USER: badgeone
      POSTGRES_PASSWORD: badgeone
      POSTGRES_DB: badgeone
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badgeone"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: badgeone_redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: badgeone_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql+psycopg://badgeone:badgeone@postgres:5432/badgeone
      REDIS_URL: redis://redis:6379
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET:-badgeone-super-secret-key-change-in-production-2024}
      POLYGON_RPC_URL: ${POLYGON_RPC_URL:-https://polygon-rpc.com}
      POLYGON_PRIVATE_KEY: ${POLYGON_PRIVATE_KEY:-}
      POLYGON_CONTRACT_ADDRESS: ${POLYGON_CONTRACT_ADDRESS:-}
      POLYGONSCAN_API_KEY: ${POLYGONSCAN_API_KEY:-}
      BADGE_VERIFY_BASE_URL: ${BADGE_VERIFY_BASE_URL:-https://app.badgeone.com.br/verify}

  frontend:
    build: ./frontend
    container_name: badgeone_frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    build: ./nginx
    container_name: badgeone_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
