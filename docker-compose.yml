version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: badgeone_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: badgeone
      POSTGRES_PASSWORD: badgeone
      POSTGRES_DB: badgeone
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: badgeone_redis
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: badgeone_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgres://badgeone:badgeone@postgres:5432/badgeone
      REDIS_URL: redis://redis:6379

  frontend:
    build: ./frontend
    container_name: badgeone_frontend
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    build: ./nginx
    container_name: badgeone_nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
