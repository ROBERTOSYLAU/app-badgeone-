version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: badgeone
      POSTGRES_USER: badgeone
      POSTGRES_PASSWORD: badgeone
    volumes:
      - badgeone_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: production
      APP_NAME: "Badge One API"
      DATABASE_URL: "postgresql+psycopg://badgeone:badgeone@postgres:5432/badgeone"
      JWT_SECRET: "CHANGE_ME_STRONG_SECRET"
      JWT_ALGORITHM: "HS256"
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE: "/api"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  badgeone_pgdata:
